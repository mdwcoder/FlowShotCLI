[project]
name = "flowshot-cli"
version = "0.1.0"
description = "Terminal workflow recorder and script generator"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.scripts]
start = "python main.py"
